apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: kata-fc
spec:
  template:
    metadata:
      labels:
        workload: sandboxed
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: kata-fc
      taints:
        - key: workload
          value: sandboxed
          effect: NoSchedule
      requirements:
        # 8i families are the only ones that support EC2 nested virtualization,
        # which kata + Firecracker requires (it checks for /dev/kvm at boot).
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["c8i", "m8i", "r8i"]
        # On-demand only — a spot reclaim would kill a running sandboxed VM
        # mid-session (the rest of the workshop pools are on-demand too).
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-cpu
          operator: Gt
          values: ["2"]
      expireAfter: 720h
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
  limits:
    cpu: "100"
